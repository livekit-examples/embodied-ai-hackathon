[project]
name = "leslider-molmo-inference"
version = "0.1.0"
description = "Standalone MolmoAct2-SO100_101 inference operator for the leslider robot over livekit-portal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-portal>=0.2.1",
    "livekit-api>=0.7",
    "numpy>=2.0,<2.3",
    "python-dotenv>=1",
    "torch>=2.7,<2.11",
    "torchvision>=0.22,<0.26",
    "pillow>=10,<13",
    "huggingface-hub>=1.0,<2",
    "safetensors>=0.4.3,<1",
    "einops>=0.8,<0.9",
    "peft>=0.18,<1",
    "transformers>=5.4,<5.6",
]

# Flat script project: run from this directory with:
#   uv run python inference.py
#   uv run python smoke_test.py

# Wire contract for the move_to operator. Must match the robot's
# portal.yaml on the other end of the room (same camera names + state /
# action schemas), otherwise the synchronizer rejects observations.
#
# Hardware on the robot side = leslider: an SO-101 arm mounted on a
# linear slider. We don't drive any of it from here — this operator is
# a pure sensor that watches `overhead_camera` and answers move_to()
# RPCs. The state / action blocks are kept identical to portal-hitl's
# contract so the same robot.py can serve both operators concurrently.

version: 1

fps: 30

# When a state sample arrives at the operator's synchronizer with no
# fresh frame inside the sync window, reuse the last good frame instead
# of dropping the state. Same rationale as portal-hitl.
reuse_stale_frames: true

# Subscribe to the executed action stream over the wire. We don't use
# it here, but enabling it costs ~nothing and keeps the contract aligned
# with peers that do care (e.g. teleoperator recording).
action_subscription: true

videos:
  - { name: arm_camera,      codec: mjpeg, quality: 90 }
  - { name: overhead_camera, codec: mjpeg, quality: 90 }

# 6 arm motor positions + 1 slider velocity.
state:
  - { name: shoulder_pan.pos,  dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos,    dtype: f32 }
  - { name: wrist_flex.pos,    dtype: f32 }
  - { name: wrist_roll.pos,    dtype: f32 }
  - { name: gripper.pos,       dtype: f32 }
  - { name: slider.vel,        dtype: f32 }

action:
  - { name: shoulder_pan.pos,  dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos,    dtype: f32 }
  - { name: wrist_flex.pos,    dtype: f32 }
  - { name: wrist_roll.pos,    dtype: f32 }
  - { name: gripper.pos,       dtype: f32 }
  - { name: slider.vel,        dtype: f32 }
